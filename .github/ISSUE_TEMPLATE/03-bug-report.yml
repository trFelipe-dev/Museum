name: Reporte de error
description: Informar un comportamiento incorrecto.
title: "[BUG] "
labels:
  - "type: bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Descripción del error
      description: Explica qué ocurre.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Observar...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Navegador, dispositivo y sistema operativo.
  - type: textarea
    id: evidence
    attributes:
      label: Evidencias
      description: Añade capturas, mensajes de consola o registros relevantes.
